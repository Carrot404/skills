name: Update External Skills

on:
  schedule:
    # 每周一北京时间 04:17 运行，避开整点任务高峰。
    - cron: "17 4 * * 1"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  update:
    name: Check and Sync Updates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository and Submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Update External Skills
        run: pnpm run update

      - name: Validate Skills
        run: pnpm run check

      - name: Create Update PR
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            .gitmodules
            sources
            skills
          branch: automation/update-skills
          delete-branch: true
          commit-message: "chore: Update External Skills"
          title: "chore: Update External Skills"
          body: |
            The scheduled check found updates to external skills.

            - Update Git submodule pointers
            - Sync the published skills
            - Ran `pnpm run check`

            Review upstream skill behavior changes before merging.
